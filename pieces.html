<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pieces</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Ojuju:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>

    .flex-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      margin-top: 4rem;
    }

    @media (max-width: 900px) {
      .flex-container {
        grid-template-columns: 1fr;
      }
      .grid-item {
        font-size: 1rem;
      }
      .grid-item img,
      .grid-item video {
        height: 240px;
      }
      .grid-item:hover {
        transform: none;
        box-shadow: none;
      }
      .grid-item:hover img,
      .grid-item:hover video {
        transform: none;
      }
    }

    .grid-item {
      background-color: rgba(205, 230, 193, 0.906);
      border: 1px solid var(--muted);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 1.3rem;
      letter-spacing: 0.05em;
      color: black;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .grid-item:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .grid-item img,
    .grid-item video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      margin-top: 1rem;
      border: 1px solid var(--muted);

      transition: transform 0.2s ease;
    }

    .grid-item:hover img,
    .grid-item:hover video {
      transform: scale(1.28);
    }

    .top-nav {
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>

<body>

  <main class="wrap">
    <header>
      <img src="gifs/horses_back.gif" height="120">
       <nav class="top-nav">
      <a href="index.html">← back</a>
        <h1>Pieces</h1>
      </nav>
    </header>

    <div class="flex-container">

      <a href="stereotype.html" class="grid-item"  weight="100" height="100">  Stereotype Threat [2024-2025]
        <video autoplay loop muted playsinline style="object-fit: contain; background: black;">
          <source src="mp4/car.mp4" type = "video/mp4">
        </video>
      </a>
      <a href="mut.html" class="grid-item" weight="100" height="100"> MUT [2025]
        <video autoplay loop muted playsinline>
          <source src="mp4/mut-start.mp4" type="video/mp4">
        </video>
      </a>
      <a href="mirrorofwounds.html" class="grid-item"  weight="100" height="100">  Mirror of Wounds [2023-2024]
        <video autoplay loop muted playsinline style="object-fit: contain; background: black;">
          <source src="mp4/intro-mirror.mp4" type = "video/mp4">
        </video>
      </a>
      <a href="dubistfit.html" class="grid-item"  weight="100" height="100">  Du bist fit! [2025]
        <video autoplay loop muted playsinline>
          <source src="mp4/sc.mp4" type="video/mp4">
        </video>
      </a>
      <a href="oneyearthirtyseconds.html" class="grid-item"  weight="100" height="100">  ONE YEAR THIRTY SECONDS [2025]
        <video autoplay loop muted playsinline>
          <source src="mp4/rocks.mp4" type = "video/mp4">
        </video>
      </a>
      <a href="radio.html" class="grid-item"  weight="100" height="100">  WEISS / WEISSLICH 7a: Rauschempfänger [2026]
        <video autoplay loop muted playsinline>
          <source src="mp4/radio-intro.mp4" type = "video/mp4">
        </video>
      </a>

    </div>
  </main>

    <script>
    document.querySelectorAll('.grid-item').forEach(item => {
      const video = item.querySelector('video');
      if (!video) return;
      item.addEventListener('mouseenter', () => video.pause());
      item.addEventListener('mouseleave', () => video.play().catch(() => {}));
    });
  </script>
</body>
</html>
